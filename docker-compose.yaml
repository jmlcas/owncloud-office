services:

  owncloud:
    image: owncloud/server:${OWNCLOUD_IMAGE}
    container_name: owncloud_server
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    environment:
      - OWNCLOUD_DOMAIN=${OWNCLOUD_DOMAIN}
      - OWNCLOUD_TRUSTED_DOMAINS=${OWNCLOUD_TRUSTED_DOMAINS}
      - OWNCLOUD_OVERWRITE_CLI_URL=${OWNCLOUD_OVERWRITE_CLI_URL}
      - OWNCLOUD_DB_TYPE=mysql
      - OWNCLOUD_DB_NAME=owncloud
      - OWNCLOUD_DB_USERNAME=owncloud
      - OWNCLOUD_DB_PASSWORD=owncloud
      - OWNCLOUD_DB_HOST=mariadb
      - OWNCLOUD_ADMIN_USERNAME=${ADMIN_USERNAME}
      - OWNCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OWNCLOUD_MYSQL_UTF8MB4=true
      - OWNCLOUD_REDIS_ENABLED=true
      - OWNCLOUD_REDIS_HOST=redis
    volumes:
      - t./files:/mnt/data
    ports:
      - ${HTTP_PORT}:8080

  mariadb:
    image: mariadb:${MARIADB_IMAGE}
    container_name: owncloud_mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=owncloud
      - MYSQL_USER=owncloud
      - MYSQL_PASSWORD=owncloud
      - MYSQL_DATABASE=owncloud
      - MARIADB_AUTO_UPGRADE=1
    command: ["--max-allowed-packet=128M", "--innodb-log-file-size=64M"]
    volumes:
      - ./mysql:/var/lib/mysql

  redis:
    image: redis:${REDIS_IMAGE}
    container_name: owncloud_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["--databases", "1"]
    volumes:
      - ./redis:/data

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    stdin_open: true
    tty: true    
    restart: unless-stopped
    ports:
      - "9920:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=dCYlN0UjXA0sO4lQaz0JxMd11U1c0lausHwKrW1Jat8=
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true

  euro-office:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: euro-office
    stdin_open: true
    tty: true
    ports:
      - "9940:80"
    restart: unless-stopped
    environment:
      - EXAMPLE_ENABLED=true
      - JWT_SECRET=dCYlN0UjXA0sO4lQaz0JxMd11U1c0lausHwKrW1Jat8=
      - THEME=euro-office

  collabora:
    image: collabora/code:latest
    container_name: collabora
    ports:
      - "9980:9980"
    restart: unless-stopped
    environment:
      - extra_params=--o:ssl.enable=false
      - domain=localhost  # IP | example.com
      - username=User
      - password=p4ssw0rd
      - dictionaries=es_ES
      - TZ=Europe/Madrid
